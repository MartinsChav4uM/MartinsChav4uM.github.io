<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b4a33"/>
      <stop offset="1" stop-color="#26180f"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe0a8" stop-opacity=".75"/>
      <stop offset="1" stop-color="#ffe0a8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="rim" cx=".35" cy=".4" r=".6">
      <stop offset="0" stop-color="#ffcf86" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffcf86" stop-opacity="0"/>
    </radialGradient>
    <filter id="b" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="300" height="200" fill="url(#wall)"/>
  <!-- luz da janela -->
  <path d="M0,0 L120,0 L260,200 L120,200Z" fill="url(#light)" filter="url(#b)"/>
  <g stroke="#26180f" stroke-width="5" opacity=".35" filter="url(#b)"><path d="M40,0 L150,200"/><path d="M80,0 L200,200"/></g>
  <circle cx="170" cy="90" r="90" fill="url(#rim)"/>
  <!-- planta -->
  <g fill="#2e3a22">
    <path d="M30,200 C34,170 26,150 12,136 C30,142 40,160 38,200Z"/>
    <path d="M44,200 C46,160 60,140 78,132 C66,150 56,172 54,200Z"/>
    <path d="M36,200 C30,176 34,150 48,128 C46,152 44,176 46,200Z"/>
  </g>
  <!-- retrato de perfil, contra a luz -->
  <g fill="#1a0f0a">
    <path d="M150,200 C150,176 160,160 176,152 L176,138 C168,136 164,130 164,124 L160,122 L164,116 L162,108 C162,86 176,70 196,70 C218,70 232,88 230,110 C229,124 224,134 216,140 L216,152 C234,160 246,176 248,200Z"/>
    <path d="M196,66 C214,58 236,66 238,86 C240,96 236,104 232,108 C230,92 222,80 206,78Z"/>
    <circle cx="224" cy="68" r="11"/>
  </g>
  <path d="M164,124 L160,122 L164,116 L162,108 C162,86 176,70 196,70" fill="none" stroke="#ffd8a0" stroke-width="1.6" opacity=".9"/>
  <path d="M176,152 C160,160 150,176 150,200" fill="none" stroke="#ffd8a0" stroke-width="1.4" opacity=".6"/>
</svg>
